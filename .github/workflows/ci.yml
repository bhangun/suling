name: Suling CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "pom.xml"
      - "gradlew"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "pom.xml"
      - "gradlew"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install Native Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libflac-dev ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev

      - name: Build and Test with Gradle
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace test

      - name: Build with Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn --no-transfer-progress clean package -DskipTests

  publish-snapshot:
    name: Publish Snapshot
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Publish to Maven Local
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon publishToMavenLocal -x test
